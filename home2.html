<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Freddy Exchange - P2P NGN Rates</title>

  <!-- Font Awesome for icons -->
  <script src="https://kit.fontawesome.com/38ce96363c.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="./css/home2.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <nav class="header-nav">
      <div class="logo"><i class="fa-brands fa-flutter fa-rotate-270 fa-2xl" style="color: #0254f7;"></i>&nbsp;
        Freddy <span>Exchange</span></div>
      <div class="hamburger" id="hamburger"><i class="fas fa-bars"></i></div>
      <ul id="nav-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="#your-list">Rates</a></li>
        <li><a href="#calc-btn">Calculator</a></li>
        <li><a href="#last-updated">Updates</a></li>
        <li><a href="#footer">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="wrap">
      <div class="header-meta">
        <div>
          <div class="title">P2P NGN Rates</div>
          <div class="meta">Real-time prices</div>
        </div>
        <div id="last-updated" class="meta">Updated: --</div>
      </div>

      <div class="card">
        <!-- Rates -->
        <div class="list" id="your-list"></div>

        <!-- Calculator -->
        <div class="calculator">
          <h3>Calculator</h3>
          <label for="calc-coin">Select coin</label>
          <select id="calc-coin">
            <option value="usdt">USDT</option>
            <option value="usdc">USDC</option>
            <option value="btc">BTC</option>
            <option value="eth">ETH</option>
          </select>

          <label for="calc-amount">Amount (in selected coin)</label>
          <input id="calc-amount" type="number" placeholder="e.g. 100 or 0.5">

          <label for="calc-type">Transaction type</label>
          <select id="calc-type">
            <option value="sell">Sell (you give NGN)</option>
            <option value="buy">Buy (you receive NGN)</option>
          </select>

          <button id="calc-btn">Calculate NGN</button>
          <div id="calc-output">You will receive: ₦ --</div>
        </div>
        <div id="source-indicator" class="meta" style="margin-top:10px;">Source: --</div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer id="footer">
    <p>© 2025 Freddy Exchange. All Rights Reserved.</p>

      <a href="#">Privacy Policy</a> |

    </p>

      <a href="mailto:support@osagieosayi123.com"><i class="fas fa-envelope"></i></a>
    </p>
  </footer>
   <script src="./js/home2.js"></script>
</body>
</html>
